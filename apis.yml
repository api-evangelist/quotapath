aid: quotapath
name: QuotaPath
description: >-
  QuotaPath is a sales commission tracking and compensation management platform
  that helps revenue, finance, and sales operations teams design, automate, and
  audit variable-pay programs. It sits as a system of record between a company's
  CRM, finance stack, and payroll — pulling deals from HubSpot and Salesforce,
  applying commission plans, quotas, and ASC 606 ledger logic, and syncing
  payouts to accounting and HRIS systems like QuickBooks, NetSuite, and Rippling.
  QuotaPath exposes a REST API (available on the Premium tier) for pushing deals,
  reading payouts, managing quota assignments, and building custom CRM and
  payroll integrations. The API uses token-based API-key authentication over
  https://api.quotapath.com/v1 with limit/offset pagination.
