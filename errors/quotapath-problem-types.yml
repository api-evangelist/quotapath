  fields:
  - name: detail
    type: string
    description: Human-readable error message. The only field observed on error responses.
  note: >-
    QuotaPath returns the stock Django REST Framework error envelope — a flat JSON
    object with a single `detail` string. There is no machine-readable error code,
    no error type URI, no request id in the body, and no application/problem+json
    (RFC 9457) media type. Field-level validation failures in DRF conventionally
    return a map of field name to message array instead of `detail`, but no
    validation error was induced against production and none is documented, so
    that shape is NOT asserted here.
