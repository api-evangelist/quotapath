limit_count: 0
summary: >-
  QuotaPath publishes NO rate limits for its REST API, and returns NO rate-limit
  response headers. The help center addresses call volume only commercially —
  "QuotaPath does not charge for API calls. How often you want to send QuotaPath
  data / make API calls is totally up to you" — which is a billing statement, not
  a documented quota. An agent has no runtime signal to back off on, and no
  documented ceiling to design against.
