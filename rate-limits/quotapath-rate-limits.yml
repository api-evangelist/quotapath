  standard_ratelimit_headers: false
  x_ratelimit_headers: false
  retry_after: false
  note: >-
    Response headers observed on a live 401 from GET https://api.quotapath.com/v1/user/
    were date, content-type, content-length, server, www-authenticate, allow,
    x-cloud-trace-context, access-control-allow-origin, vary,
    access-control-allow-headers, x-content-type-options, referrer-policy,
    cross-origin-opener-policy, set-cookie, strict-transport-security,
    permissions-policy, x-appengine-flex-applatency, via, alt-svc. None of the
    RateLimit-*, X-RateLimit-* or Retry-After families were present.
