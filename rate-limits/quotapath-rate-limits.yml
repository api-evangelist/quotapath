gaps:
- >-
  Publishing a rate-limit policy and emitting RateLimit-Limit / RateLimit-Remaining /
  RateLimit-Reset (or Retry-After on 429) would be the single cheapest
  agent-readiness improvement available to QuotaPath, particularly given the
  bulk-import endpoints (/deal/bulk/, /data/bulk-import/) invite high-volume writes.
